name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-self-test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Run self-test
        run: swift run CodexPetEnergy --self-test

      - name: Build release
        run: swift build -c release

      - name: RPC and source regression tests
        run: |
          ./scripts/test-rpc.sh
          ./scripts/test-balance.sh
          ./scripts/test-reliability.sh
          ./scripts/test-project-usage.sh

      - name: UI style and rendered layout checks
        run: |
          ./scripts/check-ui-style.sh
          ./scripts/test-mini-layout.sh
          ./scripts/test-dashboard-layout.sh
